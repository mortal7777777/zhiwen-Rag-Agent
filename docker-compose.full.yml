# full 模式覆盖：本地 BGE 嵌入/重排（挂载 langchain01/local_models，可选 GPU）
# 用法：docker compose -f docker-compose.yml -f docker-compose.full.yml up -d --build
#
# 注意：
# - 本地模型目录位于仓库上一级（langchain01/local_models），必须存在；
# - GPU 直通依赖 Docker Desktop 的 WSL2 + NVIDIA 驱动；无 GPU 时 CPU 推理也可用；
# - 若本机曾用 lite 模式建过索引，切换后请删除 app-meta 卷重来（索引维度不同）。

services:
  backend:
    build:
      target: full
    environment:
      EMBEDDING_PROVIDER: local
      EMBEDDING_MODEL_DIR: /models/bge-base-zh-v1.5
      RERANKER_PROVIDER: local
      RERANKER_CACHE_DIR: /models/models--BAAI--bge-reranker-v2-m3
      EMBEDDING_FP16: "1"
    volumes:
      - ../local_models:/models:ro
    # 无 NVIDIA 显卡/驱动的机器：先删掉下面 deploy.resources 整段再启动——
    # GPU 预留无法满足时 docker 直接拒绝起容器（could not select device driver）；
    # 删除后走 CPU 推理，慢但可用（2026-10-14 修正文档口径）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
