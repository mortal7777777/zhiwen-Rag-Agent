# 持续集成（P0，2026-10-08 入库）
#
# 定位：本机 pre-commit 钩子只做"提前反馈"，CI 才是唯一权威——
# 钩子可被 --no-verify 跳过、可因解释器缺失而放行，CI 不能。
#
# 三个 job：
#   backend   —— 全量 pytest（367+ 用例，不需要 GPU / MySQL / 外网；lite 依赖即可跑，
#                顺带验证 lite 档没有偷偷依赖 torch）
#   frontend  —— 构建 + 裸 hex 防回退 + 对比度审计（两个守门脚本都是纯 Python，无浏览器依赖）
#   eval-gate —— RAGAS 回归门槛：需要真实后端（OpenSearch/MySQL/模型 API），
#                只在手动触发且配置了自托管 runner 时执行，默认跳过
#
# 本地等价命令（提交前自查）：
#   python -m pytest backend/tests -q
#   cd frontend && npm ci && npm run build
#   python scripts/check_frontend_hex.py && python scripts/contrast_audit.py

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Dockerfile 是 3.11，本机开发是 3.12 —— 两边都保
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-lite.txt
      - name: 安装依赖（lite：不装 torch / sentence-transformers）
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-lite.txt pytest
      - name: 后端测试
        run: python -m pytest backend/tests -q
      - name: 配置守门（effective 不得传 default）
        run: python scripts/check_effective_default.py
      - name: 协议守门（SSE 事件前后端一致）
        run: python scripts/check_sse_protocol.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
        working-directory: frontend
      - name: 构建
        run: npm run build
        working-directory: frontend
      - name: 前端逻辑单测（useAgentStream / useTypewriter / API+SSE）
        run: npm run check
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 前端守门（裸 hex / 对比度）
        run: |
          python scripts/check_frontend_hex.py
          python scripts/contrast_audit.py

  eval-gate:
    # 需要真实后端（OpenSearch + MySQL + 模型 API）。默认跳过：
    # 想启用就在仓库 Variables 里设 EVAL_RUNNER=self-hosted，并注册一台本机 runner。
    if: github.event_name == 'workflow_dispatch' && vars.EVAL_RUNNER == 'self-hosted'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 回归门槛（真实调模型，耗时数分钟；后端需已启动）
        run: python scripts/regression_gate.py --limit 3
